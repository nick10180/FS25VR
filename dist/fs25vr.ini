; fs25vr bridge settings. This file lives next to dinput8.dll in the game's x64 folder.
; Unofficial mod for Farming Simulator 25 - not affiliated with GIANTS Software.
[vr]
; 0 = the bridge does nothing (plain dinput8 passthrough)
enabled=1

; --- image ---------------------------------------------------------------------------------
; 1 = each eye renders a centred frustum enclosing its field of view. Needed for the game's
;     ambient occlusion to match between the eyes. 0 = exact off-centre frustum (fewer pixels).
symmetricFrustum=1
; >1 makes the world feel smaller, <1 bigger
worldScale=1.0
; flat screen used for menus, map and shop (metres)
menuDistance=2.0
menuWidth=2.6

; --- quad views (F11 menu: stereo mode) ------------------------------------------------------
; Each eye also renders a focus view of the middle of its field of view, laid over the eye's
; image. Every view renders at the game's render resolution (window size times the 3D
; resolution in the F11 menu), so the focus view's narrower field of view gets a higher pixel
; density: 0.5 = twice the density in the middle. Values like the quad views layer's fixed
; foveation (horizontal_fixed_section, vertical_fixed_section, smoothen_focus_view_edges).
; fraction of the eye's field of view (width, height)
quadFocusWidth=0.5
quadFocusHeight=0.45
; blended edge of the focus view (fraction of its size, 0 = hard edge)
quadFocusSmoothing=0.18

; --- timing --------------------------------------------------------------------------------
; 1 = the headset frame loop runs on its own thread; the game never waits for the headset
asyncSubmit=1
; hold the simulation still on right-eye frames so both eyes show the same moment
syncEyes=1
; if moving objects still look doubled between the eyes, try 1
syncPhase=0
; which eye is drawn on even frames (0 = left, 1 = right). If one eye shimmers or
; stutters on fine detail and the other does not, try 1 and see whether it moves to the other eye
eyeOrder=0
; starting guess for frames between a camera update and the image that shows it; the bridge
; measures the real value automatically when VR starts (see fs25vr.log)
presentLag=0
; ignore the game's vsync so the headset, not the desktop monitor, paces the game
forceNoVsync=1

; --- window and mouse ----------------------------------------------------------------------
; shrink a game window taller than the monitor to fit it (rendering stays at full size)
fitWindow=1
; keep the mouse inside the game window while it is focused (Alt-Tab releases it)
clipMouse=1
; draw the mouse pointer into the headset image (menus, shop, map)
showCursor=1

; --- diagnostics ---------------------------------------------------------------------------
; GPU timing and a per-frame CSV (fs25vr_profile.csv next to this file)
profile=0
; per-frame logging to fs25vr.log
debugLog=0
