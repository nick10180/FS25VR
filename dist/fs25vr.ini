; fs25vr bridge settings. This file lives next to dinput8.dll in the game's x64 folder.
; Unofficial mod for Farming Simulator 25 - not affiliated with GIANTS Software.
[vr]
; 0 = the bridge does nothing (plain dinput8 passthrough)
enabled=1

; --- image ---------------------------------------------------------------------------------
; 1 = each eye renders a centred frustum enclosing its field of view. Needed for the game's
;     ambient occlusion to match between the eyes. 0 = exact off-centre frustum (fewer pixels).
symmetricFrustum=1
; >1 makes the world feel smaller, <1 bigger
worldScale=1.0
; flat screen used for menus, map and shop (metres)
menuDistance=2.0
menuWidth=2.6
; HUD area while VR runs (F10 shows the HUD): share of the field of view both eyes see.
; Larger = HUD further out, 0 = leave the HUD where the game puts it.
hudArea=0.45
; distance in metres the HUD appears at in VR (0 = infinity, as the game draws it)
hudDepth=0
; HUD moved down by this share of the image height (Ctrl+F10 changes it in game)
hudLower=0.08
; HUD in 0 = both eyes, 1 = left eye only, 2 = right eye only
hudEye=0

; send the game's depth buffer to the headset runtime with each eye image, for better reprojection of
; near objects (Meta's Quest Link runtime uses it most). 0 = off.
depthLayer=1

; 0 = VR when a headset is ready at start (SteamVR running, or Quest Link / Virtual Desktop
; connected), otherwise the game starts normally; 1 = always VR; 2 = never
vrMode=0

; render size the bridge writes into the game's game.xml at every VR start (windowed, vsync off;
; your own display settings come back for flat play). 0 = the size measured for your headset in
; the first VR session (fs25vr_size.ini; restart the game once after it). Other values = a fixed size.
renderWidth=0
renderHeight=0

; fixed foveated rendering (variable rate shading; F5 toggles in game): full rate in the centre,
; 2x2 in a ring around it, 4x4 at the edges and where the lens never shows. Needs a GPU with VRS
; tier 2 (NVIDIA RTX 20 and newer, AMD RX 6000 and newer, Intel Arc).
foveated=1
; radius of the full-rate centre and of the 2x2 ring, as a fraction of the field of view to each
; side (1.0 = the edge of the view). Larger = sharper edges, less gain.
foveaInner=0.40
foveaOuter=0.65

; --- timing --------------------------------------------------------------------------------
; 1 = the headset frame loop runs on its own thread; the game never waits for the headset
asyncSubmit=1
; hold the simulation still on right-eye frames so both eyes show the same moment
syncEyes=1
; if moving objects still look doubled between the eyes, try 1
syncPhase=0
; which eye is drawn on even frames (0 = left, 1 = right). If one eye shimmers or
; stutters on fine detail and the other does not, try 1 and see whether it moves to the other eye
eyeOrder=0
; starting guess for frames between a camera update and the image that shows it; the bridge
; measures the real value automatically when VR starts (see fs25vr.log)
presentLag=0
; ignore the game's vsync so the headset, not the desktop monitor, paces the game
forceNoVsync=1

; --- window and mouse ----------------------------------------------------------------------
; shrink a game window taller than the monitor to fit it (rendering stays at full size)
fitWindow=1
; keep the mouse inside the game window while it is focused (Alt-Tab releases it)
clipMouse=1
; draw the mouse pointer into the headset image (menus, shop, map)
showCursor=1

; --- diagnostics ---------------------------------------------------------------------------
; GPU timing and a per-frame CSV (fs25vr_profile.csv next to this file)
profile=0
; per-frame logging to fs25vr.log
debugLog=0
